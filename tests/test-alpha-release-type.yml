name: Test alpha release type passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy file to upload
        run: |
          echo "dummy jar content" > /tmp/test-alpha.jar
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-alpha.jar
          changelog: "## Alpha Release\n\nThis is a test changelog."
          changelog_type: markdown
          display_name: "Test Mod 1.0.0-alpha"
          game_versions: "7498"
          release_type: alpha
        # The action will fail at the API call due to invalid token,
        # but local validation (release_type=alpha) should pass
        continue-on-error: true
      - name: Assert step failed at API stage (alpha release_type is valid)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Should fail at API call (invalid token), not at local validation
          # If it failed due to "Invalid release type" it would also be failure,
          # but the key is that alpha is a valid value and the action proceeds to API
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail at API stage, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with alpha release_type reached API stage as expected"
