name: Test basic upload (graceful failure with invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          echo "dummy content for upload test" > /tmp/test-upload.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          changelog: "Test changelog"
          changelog_type: text
          release_type: alpha

      - name: Assert action ran and failed gracefully (invalid credentials expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILE_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "file_id: $FILE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FILE_ID" ]; then
              echo "FAIL: action succeeded but output 'id' is empty"
              exit 1
            fi
            echo "PASS: action succeeded and returned file id: $FILE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
