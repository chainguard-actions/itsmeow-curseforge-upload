name: Test basic upload invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy file to upload
        run: |
          echo "dummy mod content" > /tmp/test-mod.jar

      - name: Invoke CurseForge upload action (expect API failure, not input failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-mod.jar
          changelog: "Test changelog"
          changelog_type: text
          game_versions: "1.19.2"
          release_type: release

      - name: Assert action ran (failed at API level, not input level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (invalid token/project), but it should have
          # started and attempted the API call — not crashed on missing inputs.
          # We accept 'failure' as the expected outcome here since we have no
          # real CurseForge credentials in CI.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and produced outcome '$OUTCOME' (failure due to invalid credentials is expected)"
