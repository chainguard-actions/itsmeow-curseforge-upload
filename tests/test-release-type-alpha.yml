name: Test alpha release type is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy file to upload
        run: echo "dummy jar content" > /tmp/test-upload.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token-that-will-fail-auth
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          changelog: "Test changelog for alpha release"
          changelog_type: markdown
          game_versions: "7498"
          release_type: alpha
      - name: Assert action failed at API stage (not at release_type validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail due to API auth, not due to release_type validation.
          # Either way it fails, but we confirm it ran past the release_type check.
          # If release_type 'alpha' was rejected, the action would also fail — so we
          # just confirm the action ran (outcome is failure due to API, not input validation).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (API auth error expected)"
            exit 1
          fi
          echo "PASS: action ran with alpha release type (failed at API stage as expected)"
