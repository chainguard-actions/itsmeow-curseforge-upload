name: Test invalid project ID error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy upload file
        run: echo "dummy content" > /tmp/test-upload.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-validation-test
          project_id: not-a-number
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          release_type: release
      - name: Assert action failed due to invalid project ID
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project_id is not an integer, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when project_id is not an integer"
