name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy file to upload
        run: |
          echo "dummy mod content" > /tmp/test-mod-optional.jar

      - name: Invoke CurseForge upload action with optional inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          project_id: "654321"
          game_endpoint: minecraft
          file_path: /tmp/test-mod-optional.jar
          changelog: "## Test Changelog\n\n- Feature A\n- Feature B"
          changelog_type: markdown
          display_name: "My Mod v1.0.0"
          game_versions: "1.19.2,1.18.2"
          release_type: beta
          relations: "jei:requiredDependency,optifine:optionalDependency"

      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail at the API level (invalid credentials),
          # not at input parsing. 'skipped' would indicate a setup problem.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with optional inputs and produced outcome '$OUTCOME'"
