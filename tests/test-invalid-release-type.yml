name: Test invalid release type error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy upload file
        run: echo "dummy content" > /tmp/test-upload.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-validation-test
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          release_type: invalid-type
      - name: Assert action failed due to invalid release type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when release_type is invalid, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when release_type is invalid"
