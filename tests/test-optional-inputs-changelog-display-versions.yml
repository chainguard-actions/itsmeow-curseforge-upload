name: Test optional inputs - changelog, display_name, game_versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy upload file
        run: echo "dummy content" > /tmp/test-upload.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-validation-test
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          release_type: release
          changelog: "This is a test changelog entry."
          changelog_type: text
          display_name: "My Test Mod 1.0.0"
          game_versions: "1234,5678"
      - name: Assert action ran (failed due to fake token is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with changelog, display_name, and game_versions inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
