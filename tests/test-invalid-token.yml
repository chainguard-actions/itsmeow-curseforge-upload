name: Test invalid token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload file
        run: |
          echo "dummy mod content" > /tmp/test-mod.jar

      - name: Run action with invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: "invalid-token-12345"
          project_id: "123456"
          game_endpoint: "minecraft"
          file_path: "/tmp/test-mod.jar"
          changelog: "Test changelog"
          changelog_type: "text"
          game_versions: "1.16.5"
          release_type: "alpha"

      - name: Assert action failed (invalid token should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
