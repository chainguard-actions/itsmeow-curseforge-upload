name: Test all inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy upload file
        run: |
          echo "dummy mod file content" > /tmp/test-mod.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-mod.jar
          changelog: "Test changelog entry"
          changelog_type: text
          display_name: "Test Mod v1.0.0"
          parent_file_id: "789012"
          game_versions: "1234,5678"
          release_type: alpha
          relations: "some-mod:requiredDependency,other-mod:optionalDependency"

      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
