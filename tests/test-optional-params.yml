name: Test upload with optional parameters (graceful failure with invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          echo "dummy mod content" > /tmp/my-mod-1.0.0.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          project_id: "999999"
          game_endpoint: minecraft
          file_path: /tmp/my-mod-1.0.0.jar
          changelog: "## Changelog\n- Added feature A\n- Fixed bug B"
          changelog_type: markdown
          display_name: "My Mod 1.0.0"
          game_versions: "7498,8857"
          release_type: release
          relations: "jei:requiredDependency,optifine:optionalDependency"

      - name: Assert action ran and failed gracefully (invalid credentials expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILE_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "file_id: $FILE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FILE_ID" ]; then
              echo "FAIL: action succeeded but output 'id' is empty"
              exit 1
            fi
            echo "PASS: action succeeded and returned file id: $FILE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
