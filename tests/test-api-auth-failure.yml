name: Test API authentication failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy file to upload
        run: echo "dummy jar content" > /tmp/test-upload.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token-that-will-fail-auth
          project_id: "123456"
          game_endpoint: minecraft
          file_path: /tmp/test-upload.jar
          changelog: "Test changelog"
          changelog_type: text
          game_versions: "7498"
          release_type: release
      - name: Assert action failed due to API error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API token"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API credentials"
